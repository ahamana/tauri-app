[bootstrap.packages]
"apt:zsh" = "latest"

[bootstrap.mise_shell_activate]
bashrc = true
zshrc = true

[plugins]
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tools]
claude = "latest"
ghalint = "latest"
github-cli = { version = "latest", postinstall = "gh extension install --force github/gh-actions-lock" }
jactionlint = "latest"
rust = { version = "latest", components = "clippy" }
shellcheck = "latest"
tombi = "latest"
vite-plus = "latest"
zizmor = "latest"
