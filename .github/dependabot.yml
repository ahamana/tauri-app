version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      vite-plus:
        patterns:
          - vite-plus
          - "@voidzero-dev/vite-plus-*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
