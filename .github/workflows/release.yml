name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - macos-26-intel
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - parallel:
          - name: Set up Vite+ and install dependencies
            uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0

          - name: Set up Rust
            uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
            with:
              install_args: rust
              add_shims_to_path: false
              cache: false

      - name: Build and release application
        id: build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.workspace }}/.tauri/updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: v__VERSION__ release

      - name: Create Windows portable asset
        if: &windows ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
        working-directory: src-tauri/target/release
        run: |
          ConvertFrom-Json $env:ARTIFACT_PATHS | ForEach-Object {
              if ((Split-Path $_ -Leaf) -match '(.+)-setup\.exe$') {
                  $asset = Join-Path $PWD "$($Matches[1]).zip"
                  Compress-Archive *.exe,third-party $asset
                  Write-Output "WINDOWS_PORTABLE_ASSET=$asset" >> $env:GITHUB_ENV
              }
          }

      - name: Release Windows portable asset # zizmor: ignore[superfluous-actions]
        if: *windows
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.build.outputs.appVersion }}
          files: ${{ env.WINDOWS_PORTABLE_ASSET }}
          fail_on_unmatched_files: true
