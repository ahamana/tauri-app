name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - macos-26-intel
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - parallel:
          - name: Set up Vite+ and install dependencies
            uses: voidzero-dev/setup-vp@v1.22.0

          - name: Set up Rust
            uses: jdx/mise-action@v5.2.5
            with:
              install_args: rust
              add_shims_to_path: false
              cache: false

      - name: Build and release application
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.workspace }}/.tauri/updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: v__VERSION__ release
