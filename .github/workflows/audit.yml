name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1-5"
      timezone: Asia/Tokyo

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  npm:
    name: npm
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        shell: bash
        # Vite+ ships Vite as `@voidzero-dev/vite-plus-core`, whose version does not
        # satisfy the `vite` peer range of plugins such as `@vitejs/plugin-react`.
        # pnpm covers this with `peerDependencyRules` in pnpm-workspace.yaml.
        run: >- # jactionlint ignore=unlocked-install
          npm install
          --ignore-scripts
          --legacy-peer-deps
          --min-release-age=3

      - name: Run npm audit
        uses: oke-py/npm-audit-action@v5.5.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dedupe_comments: true
          dedupe_issues: true
          report_format: markdown

  cargo:
    name: Cargo
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
      issues: write

    steps:
      - *checkout

      - name: Set up Rust
        uses: jdx/mise-action@v5.2.7
        with:
          install_args: rust
          add_shims_to_path: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.90.1
        with:
          tool: cargo-audit

      - name: Run cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
