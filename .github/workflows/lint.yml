name: Lint

on:
  workflow_call:

permissions: {}

jobs:
  vite-plus:
    name: Vite+
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      - name: Run vp check
        shell: bash
        run: vp check

  clippy:
    name: Clippy
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always

    steps:
      - *checkout

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: jdx/mise-action@v5.2.7
        with:
          install_args: rust
          add_shims_to_path: false

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - name: Run Clippy
        uses: auguwu/clippy-action@1.5.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri
          args: -D warnings

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - *checkout

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
