name: Test

on:
  workflow_call:

permissions: {}

jobs:
  webview:
    name: WebView
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true

      - name: Run tests
        shell: bash
        run: >-
          vp test
          --coverage
          --reporter=default
          --reporter=junit

      - name: Publish test report
        if: ${{ always() }}
        uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b # v1.3.2
        with:
          report-path: .vitest/junit/output.xml
          title: WebView Test Report
          collapse-large-reports: true
          use-suite-name: true
          integrations-config: &junit-to-ctrf-integration |
            {
              "junit-to-ctrf": {
                "enabled": true
              }
            }

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - *checkout

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: rust
          add_shims_to_path: false

      - name: Install Rust development tools
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Run tests
        shell: bash
        run: cargo nextest run --profile ci

      - name: Publish test report
        if: ${{ always() }}
        uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b # v1.3.2
        with:
          report-path: src-tauri/target/nextest/ci/junit.xml
          title: Rust Test Report
          collapse-large-reports: true
          use-suite-name: true
          integrations-config: *junit-to-ctrf-integration
