name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  webview-test:
    name: WebView Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+ and install frontend dependencies
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true

      - name: Run tests
        run: >-
          vpr test
          --coverage
          --reporter=default
          --reporter=junit

      - name: Publish test report
        if: always()
        uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b # v1.3.2
        with:
          report-path: .vitest/junit/output.xml
          title: WebView Test Report
          collapse-large-reports: true
          use-suite-name: true
          integrations-config: &junit-to-ctrf-integration |
            {
              "junit-to-ctrf": {
                "enabled": true
              }
            }

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - *checkout

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: rust
          add_shims_to_path: false

      - name: Install Rust development tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Run Clippy
        uses: auguwu/clippy-action@9817d076b82df0194935be9db6154c56ac07b317 # 1.5.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri
          args: -D warnings

      - name: Run tests
        run: cargo nextest run --profile ci

      - name: Publish test report
        if: always()
        uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b # v1.3.2
        with:
          report-path: src-tauri/target/nextest/ci/junit.xml
          title: Rust Test Report
          collapse-large-reports: true
          use-suite-name: true
          integrations-config: *junit-to-ctrf-integration
