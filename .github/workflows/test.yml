name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  webview-test:
    name: WebView Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: jdx/mise-action@v4.2.4
        with:
          install_args: node

      - name: Set up pnpm and install frontend dependencies
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: true

      # - name: Run tests
      #   run: pnpm run test

      # - name: Publish test report
      #   uses: ctrf-io/github-test-reporter@v1
      #   with:
      #     report-path: ctrf/ctrf-report.json
      #     title: WebView Test Report

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: jdx/mise-action@v4.2.4
        with:
          install_args: rust

      - name: Install Rust development tools
        uses: taiki-e/install-action@v2.85.9
        with:
          tool: cargo-nextest

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - name: Run Clippy
        uses: giraffate/clippy-action@v1.0.1
        env:
          CARGO_INCREMENTAL: 1
        with:
          filter_mode: nofilter

      - name: Run tests
        env:
          CARGO_INCREMENTAL: 1
        run: cargo nextest run --profile ci

      - name: Publish test report
        uses: ctrf-io/github-test-reporter@v1.1.0
        with:
          report-path: src-tauri/target/nextest/ci/junit.xml
          title: Rust Test Report
          integrations-config: |
            {
              "junit-to-ctrf": {
                "enabled": true
              }
            }
