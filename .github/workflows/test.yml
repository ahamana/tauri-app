name: Test

on:
  workflow_call:

permissions: {}

jobs:
  webview:
    name: WebView
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      - name: Run tests
        shell: bash
        run: >-
          vp test
          --coverage
          --reporter=default
          --reporter=junit

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: ctrf-io/github-test-reporter@v1.3.2
        with:
          report-path: .vitest/junit/output.xml
          title: WebView Test Report
          collapse-large-reports: true
          use-suite-name: true
          integrations-config: &junit-to-ctrf-integration |
            {
              "junit-to-ctrf": {
                "enabled": true
              }
            }

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - *checkout

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: jdx/mise-action@v5.2.6
        with:
          install_args: rust
          add_shims_to_path: false

      - name: Install Rust development tools
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: cargo-nextest

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - name: Run tests
        shell: bash
        run: cargo nextest run --profile ci

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: ctrf-io/github-test-reporter@v1.3.2
        with:
          report-path: src-tauri/target/nextest/ci/junit.xml
          title: Rust Test Report
          collapse-large-reports: true
          use-suite-name: true
          integrations-config: *junit-to-ctrf-integration
