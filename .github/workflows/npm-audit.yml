name: npm audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1-5"
      timezone: Asia/Tokyo

jobs:
  scan:
    name: npm audit
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        # Vite+ ships Vite as `@voidzero-dev/vite-plus-core`, whose version does not
        # satisfy the `vite` peer range of plugins such as `@vitejs/plugin-react`.
        # pnpm covers this with `peerDependencyRules` in pnpm-workspace.yaml.
        run: npm install --legacy-peer-deps

      - name: Run npm audit
        uses: oke-py/npm-audit-action@4fa25b0230596f76d96b7e50b66b1e3a0d185d9f # v5.4.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dedupe_comments: true
          dedupe_issues: true
          report_format: markdown
